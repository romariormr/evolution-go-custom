# Evolution GO — stack Portainer (Docker Swarm) com banco PostgreSQL EXTERNO
# Requisitos:
#   - Imagem buildada no host: docker build -t evolution-go-custom:local .
#   - Traefik já rodando no Swarm (ajuste TRAEFIK_NETWORK)
#   - Bancos evogo_auth e evogo_users criados no PostgreSQL externo
#   - Volumes externos criados ANTES do primeiro deploy (nomes com o
#     prefixo do stack, ex.: "evolution-go_evolution_go_data" — confirme o
#     nome exato via `docker volume ls` se recriar em outro stack name):
#       docker volume create evolution-go_evolution_go_data
#       docker volume create evolution-go_evolution_go_logs
#     Sem isso, recriar a stack apaga os volumes automáticos e perde o
#     estado do WhatsApp (precisa escanear QR de novo em todas as instâncias).
#
# Variáveis de ambiente da stack (Portainer → Environment variables):
#   GLOBAL_API_KEY   — chave global da API (uuid forte)
#   EVOGO_DOMAIN     — domínio público (Traefik), ex: evolutiongo.exemplo.com
#   DB_HOST          — host do PostgreSQL externo
#   DB_USER          — usuário do banco (owner dos DBs evogo_auth/evogo_users)
#   DB_PASSWORD      — senha do usuário
#   WHATSAPP_VERSION_MAJOR/MINOR/PATCH, WHATSAPP_PLATFORM — ver .env.example
#   MESSAGE_SECRETS_RETENTION_DAYS — ver .env.example

version: "3.8"

services:
  evolution-go:
    image: "${EVOGO_IMAGE:-ghcr.io/romariormr/evolution-go-custom:latest}"
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: "evolution-go"
      GLOBAL_API_KEY: "${GLOBAL_API_KEY}"
      POSTGRES_AUTH_DB: "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "true"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      CONNECT_ON_STARTUP: "false"
      WEBHOOK_FILES: "true"
      OS_NAME: "Linux"
      WEBHOOK_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      NATS_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "5"
      CHECK_USER_EXISTS: "true"
      WHATSAPP_PLATFORM: "${WHATSAPP_PLATFORM:-desktop}"
      WHATSAPP_VERSION_MAJOR: "${WHATSAPP_VERSION_MAJOR:-2}"
      WHATSAPP_VERSION_MINOR: "${WHATSAPP_VERSION_MINOR:-3000}"
      WHATSAPP_VERSION_PATCH: "${WHATSAPP_VERSION_PATCH:-1044362777}"
      MESSAGE_SECRETS_RETENTION_DAYS: "${MESSAGE_SECRETS_RETENTION_DAYS:-30}"
    volumes:
      - evolution_go_data:/app/dbdata
      - evolution_go_logs:/app/logs
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/server/ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M
      labels:
        traefik.enable: "true"
        traefik.docker.network: "${TRAEFIK_NETWORK:-minha_rede}"
        traefik.http.routers.evolutiongo.rule: "Host(`${EVOGO_DOMAIN}`)"
        traefik.http.routers.evolutiongo.entrypoints: "websecure"
        traefik.http.routers.evolutiongo.tls: "true"
        traefik.http.services.evolutiongo.loadbalancer.server.port: "4000"

# Sem "ports:" de propósito — só acessível via Traefik (TLS), não expõe HTTP
# puro direto na porta do host. Se precisar acesso direto pra debug, use
# `docker exec` ou publique manualmente só durante o debug.

volumes:
  evolution_go_data:
    external: true
  evolution_go_logs:
    external: true

networks:
  traefik_net:
    external: true
    name: "${TRAEFIK_NETWORK:-minha_rede}"
